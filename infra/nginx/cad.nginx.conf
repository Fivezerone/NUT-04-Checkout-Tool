## nginx/cad.nginx.conf
## NUT-04 Checkout Tool — CAD (Clinic Admin Dashboard) nginx config
## Stage A scaffold — CSP headers and routing implemented in Stage C.
##
## Decision 1: CAD is hosted separately from the extension.
## Decision 8: Docker-exclusive runtime.
##
## TODO (Stage C): harden CSP, add HSTS, configure OIDC redirect URIs.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — tightened in Stage C
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content Security Policy — allowing gateway API and auth connectivity
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:* https://localhost:* ws://localhost:* wss://localhost:*;" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health probe
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}

