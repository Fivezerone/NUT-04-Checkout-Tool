name: CI Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-db-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build All
        run: npm run build

      - name: Assert HTML files exist
        run: |
          for file in dist/popup.html dist/dashboard.html dist/options.html dist/onboarding.html; do
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty!"
              exit 1
            fi
          done
          echo "All HTML files built successfully."

      - name: Verify db.js is up to date
        run: |
          if [[ -n $(git status --porcelain src/extension/db.js) ]]; then
            echo "::error::src/extension/db.js is out of date. Please run 'npm run build:db' and commit the changes."
            git diff src/extension/db.js
            exit 1
          else
            echo "db.js is up to date."
          fi
