name: CI Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-db-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify db.js is up to date
        run: |
          npm run build:db
          if [[ -n $(git status --porcelain src/extension/db.js) ]]; then
            echo "::error::src/extension/db.js is out of date. Please run 'npm run build:db' and commit the changes."
            git diff src/extension/db.js
            exit 1
          else
            echo "db.js is up to date."
          fi
