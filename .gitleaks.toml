title = "NUT-04 Gitleaks Config"

[extend]
# Use the default gitleaks ruleset as the baseline
useDefault = true

[allowlist]
paths = [
    '''\.env\.example$''',
    '''package-lock\.json$''',
    '''pnpm-lock\.yaml$''',
    '''eslint-report\.(json|txt)$''',
    '''publish-report\.json$''',
    '''dist/''',
    '''node_modules/''',
]
# The Supabase anon key is intentionally public (safe for client-side)
regexes = [
    '''VITE_SUPABASE_ANON_KEY''',
]
