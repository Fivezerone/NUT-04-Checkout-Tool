# compose.yaml — NUT-04 Checkout Tool
# Docker Compose v2 — single-file, profile-gated services.
#
# Profiles:
#   dev   — full development stack (toolchain, postgres, keycloak, postgrest,
#            api, gateway, cad, mailpit)
#   ci    — quality-gate runner (ci service, postgres, keycloak, postgrest, api)
#   e2e   — adds mock-retailers and e2e Playwright runner
#
# Usage:
#   docker compose --profile dev up --build
#   docker compose --profile ci run --rm ci
#   docker compose --profile e2e run --rm e2e
#
# NOTE: This is the Phase 0 skeleton.  Services are added incrementally as
#       Stage A progresses (§4.7-§4.8).  Stubs are marked with TODO(stage-a).

x-common-env: &common-env
  TZ: Africa/Nairobi

# ---------------------------------------------------------------------------
# Toolchain (Phase 0 baseline runner)
# ---------------------------------------------------------------------------
services:
  toolchain:
    build:
      context: .
      dockerfile: docker/toolchain.Dockerfile
      target: dev
    profiles: [dev]
    volumes:
      - .:/app:delegated
      - node_modules:/app/node_modules
    working_dir: /app
    environment:
      <<: *common-env
      NODE_ENV: development
    # No host ports — accessed via `docker compose run --rm toolchain <cmd>`
    tty: true
    stdin_open: true

  # ---------------------------------------------------------------------------
  # CI quality-gate runner
  # ---------------------------------------------------------------------------
  ci:
    build:
      context: .
      dockerfile: docker/toolchain.Dockerfile
      target: ci
    profiles: [ci]
    environment:
      <<: *common-env
      NODE_ENV: test
      CI: 'true'
    # Runs `npm run ci` by default; override with extra args
    command: ['npm', 'run', 'ci']

  # ---------------------------------------------------------------------------
  # Postgres 16 — TODO(stage-a §4.7): replace Supabase local postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
    profiles: [dev, ci, e2e]
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutriscore
      POSTGRES_USER: nutriscore_app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - pg_password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nutriscore_app -d nutriscore']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No host port — accessed internally or through gateway
    expose: ['5432']

  # ---------------------------------------------------------------------------
  # dbmate migration runner — TODO(stage-a §4.7.3)
  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/amacneil/dbmate:2.24.0@sha256:829d5f9e6c603406d173449fdb8fad1d291328eccbfc11f69a704820df74ae4e
    profiles: [dev, ci, e2e]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nutriscore_app:nutriscore_dev_secret_pg_pass_2026@postgres:5432/nutriscore?sslmode=disable}
      DBMATE_NO_DUMP_SCHEMA: 'true'
    volumes:
      - ./db/migrations:/db/migrations:ro
    secrets:
      - pg_password
    command: ['up']

  # ---------------------------------------------------------------------------
  # Keycloak — TODO(stage-a §4.7.2)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5@sha256:4883630ef9db14031cde3e60700c9a9a8eaf1b5c24db1589d6a2d43de38ba2a9
    profiles: [dev, ci, e2e]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nutriscore
      KC_DB_USERNAME: nutriscore_app
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-nutriscore_dev_secret_pg_pass_2026}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-nutriscore_dev_secret_kc_admin_2026}
    volumes:
      - ./infra/keycloak-realm.json:/opt/keycloak/data/import/nutriscore-realm.json:ro
    secrets:
      - pg_password
      - kc_admin_password
    command: ['start-dev', '--import-realm']
    healthcheck:
      test: ['CMD', '/usr/bin/bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    expose: ['8080']

  # ---------------------------------------------------------------------------
  # PostgREST — TODO(stage-a §4.7.2)
  # ---------------------------------------------------------------------------
  postgrest:
    image: postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
    profiles: [dev, ci, e2e]
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:-postgres://authenticator:nutriscore_dev_secret_pg_pass_2026@postgres:5432/nutriscore}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET_IS_BASE64: 'false'
      PGRST_JWT_ROLE_CLAIM_KEY: '.app_role'
    secrets:
      - pg_password
    expose: ['3000']

  # ---------------------------------------------------------------------------
  # API service (ported Edge Functions) — TODO(stage-a §4.7.4)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    profiles: [dev, ci, e2e]
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      <<: *common-env
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://nutriscore_app:nutriscore_dev_secret_pg_pass_2026@postgres:5432/nutriscore}
    secrets:
      - pg_password
    expose: ['4000']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:4000/health || exit 1']
      interval: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Gateway (Caddy) — TODO(stage-a §4.7.2)
  # ---------------------------------------------------------------------------
  gateway:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    profiles: [dev, ci, e2e]
    depends_on:
      - api
      - postgrest
      - keycloak
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '127.0.0.1:8443:8443' # HTTPS (dev self-signed)
      - '127.0.0.1:8080:8080' # HTTP redirect
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/healthz || exit 1']
      interval: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # CAD (separately hosted — decision 1) — TODO(stage-a §4.8)
  # ---------------------------------------------------------------------------
  cad:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    profiles: [dev]
    volumes:
      - ./dist-ui/cad:/usr/share/nginx/html:ro
      - ./infra/nginx/cad.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ['8080']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health || exit 1']
      interval: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mailpit (dev email) — dev profile only
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.22.3@sha256:f7f7c31de4de59540ad6515a0ca057a77525bca2069b6e747d873ca66c10fe08
    profiles: [dev]
    expose: ['1025', '8025']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/api/v1/info || exit 1']
      interval: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mock retailer sites (e2e profile)
  # ---------------------------------------------------------------------------
  mock-retailers:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    profiles: [e2e]
    volumes:
      - ./e2e/fixtures/retailers:/usr/share/nginx/html:ro
    expose: ['8080']

  # ---------------------------------------------------------------------------
  # E2E Playwright runner
  # ---------------------------------------------------------------------------
  e2e:
    build:
      context: .
      dockerfile: docker/toolchain.Dockerfile
      target: ci
    profiles: [e2e]
    depends_on:
      - gateway
      - mock-retailers
    environment:
      <<: *common-env
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      CI: 'true'
    volumes:
      - ./e2e/results:/app/e2e/results
    command: ['npx', 'playwright', 'test']

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
  node_modules:
  caddy_data:
  caddy_config:

# ---------------------------------------------------------------------------
# Secrets (file-based; actual files are untracked)
# ---------------------------------------------------------------------------
secrets:
  pg_password:
    file: .secrets/pg_password
  kc_admin_password:
    file: .secrets/kc_admin_password
