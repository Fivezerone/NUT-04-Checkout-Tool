# compose.yaml — NUT-04 Checkout Tool
# Docker Compose v2 — single-file, profile-gated services.
#
# Profiles:
#   dev   — full development stack (toolchain, postgres, keycloak, postgrest,
#            api, gateway, cad, mailpit)
#   ci    — quality-gate runner (ci service, postgres, keycloak, postgrest, api)
#   e2e   — adds mock-retailers and e2e Playwright runner
#
# Usage:
#   docker compose --profile dev up --build
#   docker compose --profile ci run --rm ci
#   docker compose --profile e2e run --rm e2e
#
# NOTE: This is the Phase 0 skeleton.  Services are added incrementally as
#       Stage A progresses (§4.7-§4.8).  Stubs are marked with TODO(stage-a).

x-common-env: &common-env
  TZ: Africa/Nairobi

# ---------------------------------------------------------------------------
# Toolchain (Phase 0 baseline runner)
# ---------------------------------------------------------------------------
services:
  toolchain:
    build:
      context: .
      dockerfile: docker/toolchain.Dockerfile
      target: dev
    profiles: [dev]
    volumes:
      - .:/app:delegated
      - node_modules:/app/node_modules
    working_dir: /app
    environment:
      <<: *common-env
      NODE_ENV: development
    # No host ports — accessed via `docker compose run --rm toolchain <cmd>`
    tty: true
    stdin_open: true

  # ---------------------------------------------------------------------------
  # CI quality-gate runner
  # ---------------------------------------------------------------------------
  ci:
    build:
      context: .
      dockerfile: docker/toolchain.Dockerfile
      target: ci
    profiles: [ci]
    environment:
      <<: *common-env
      NODE_ENV: test
      CI: "true"
    # Runs `npm run ci` by default; override with extra args
    command: ["npm", "run", "ci"]

  # ---------------------------------------------------------------------------
  # Postgres 16 — TODO(stage-a §4.7): replace Supabase local postgres
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.9-bookworm@sha256:b6e70e8b0be2fb48f06f03c0c5a7bccbee51ccd23ff2b2e1e4b6e1428e35b521
    profiles: [dev, ci, e2e]
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutriscore
      POSTGRES_USER: nutriscore_app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriscore_app -d nutriscore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No host port — accessed internally or through gateway
    expose: ["5432"]

  # ---------------------------------------------------------------------------
  # dbmate migration runner — TODO(stage-a §4.7.3)
  # ---------------------------------------------------------------------------
  migrate:
    image: ghcr.io/amacneil/dbmate:2.24.0@sha256:c1c0aa1a63a79af96bef3773e4ff8ad12e246a24a5c89b82ee1e4adbae49f4f5
    profiles: [dev, ci, e2e]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nutriscore_app:$(cat /run/secrets/pg_password)@postgres:5432/nutriscore?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations:ro
    secrets:
      - pg_password
    command: ["up"]

  # ---------------------------------------------------------------------------
  # Keycloak — TODO(stage-a §4.7.2)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5@sha256:placeholder_digest_update_before_use
    profiles: [dev, ci, e2e]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/nutriscore
      KC_DB_USERNAME: nutriscore_app
      KC_DB_PASSWORD_FILE: /run/secrets/pg_password
      KC_HOSTNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    secrets:
      - pg_password
      - kc_admin_password
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    expose: ["8080"]

  # ---------------------------------------------------------------------------
  # PostgREST — TODO(stage-a §4.7.2)
  # ---------------------------------------------------------------------------
  postgrest:
    image: postgrest/postgrest:v12.2.3@sha256:placeholder_digest_update_before_use
    profiles: [dev, ci, e2e]
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:$(cat /run/secrets/pg_password)@postgres:5432/nutriscore
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET_IS_BASE64: "false"
      PGRST_JWT_ROLE_CLAIM_KEY: ".app_role"
    secrets:
      - pg_password
    expose: ["3000"]

  # ---------------------------------------------------------------------------
  # API service (ported Edge Functions) — TODO(stage-a §4.7.4)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    profiles: [dev, ci, e2e]
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      <<: *common-env
      NODE_ENV: production
      DATABASE_URL: postgres://nutriscore_app:$(cat /run/secrets/pg_password)@postgres:5432/nutriscore
    secrets:
      - pg_password
    expose: ["4000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4000/health || exit 1"]
      interval: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Gateway (Caddy) — TODO(stage-a §4.7.2)
  # ---------------------------------------------------------------------------
  gateway:
    image: caddy:2.9.1-alpine@sha256:placeholder_digest_update_before_use
    profiles: [dev, ci, e2e]
    depends_on:
      - api
      - postgrest
      - keycloak
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:8443:8443"   # HTTPS (dev self-signed)
      - "127.0.0.1:8080:8080"   # HTTP redirect
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # CAD (separately hosted — decision 1) — TODO(stage-a §4.8)
  # ---------------------------------------------------------------------------
  cad:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:placeholder_digest_update_before_use
    profiles: [dev]
    volumes:
      - ./dist-ui/cad:/usr/share/nginx/html:ro
      - ./infra/nginx/cad.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose: ["8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mailpit (dev email) — dev profile only
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.22.3@sha256:placeholder_digest_update_before_use
    profiles: [dev]
    expose: ["1025", "8025"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info || exit 1"]
      interval: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mock retailer sites (e2e profile)
  # ---------------------------------------------------------------------------
  mock-retailers:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:placeholder_digest_update_before_use
    profiles: [e2e]
    volumes:
      - ./e2e/fixtures/retailers:/usr/share/nginx/html:ro
    expose: ["8080"]

  # ---------------------------------------------------------------------------
  # E2E Playwright runner
  # ---------------------------------------------------------------------------
  e2e:
    build:
      context: .
      dockerfile: docker/toolchain.Dockerfile
      target: ci
    profiles: [e2e]
    depends_on:
      - gateway
      - mock-retailers
    environment:
      <<: *common-env
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      CI: "true"
    volumes:
      - ./e2e/results:/app/e2e/results
    command: ["npx", "playwright", "test"]

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pgdata:
  node_modules:
  caddy_data:
  caddy_config:

# ---------------------------------------------------------------------------
# Secrets (file-based; actual files are untracked)
# ---------------------------------------------------------------------------
secrets:
  pg_password:
    file: .secrets/pg_password
  kc_admin_password:
    file: .secrets/kc_admin_password

